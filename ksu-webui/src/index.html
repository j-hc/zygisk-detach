<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Zygisk Detach</title>
	<link rel="stylesheet" href="styles.css" type="text/css">
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
	<script type="module" crossorigin src="index.js" type="text/javascript"></script>
</head>

<body>
	<div class="header">
		<div class="title-container">
			<h1>Zygisk Detach</h1>
			<p class="subtitle">Select apps to detach from Play Store updates</p>
		</div>
		<div class="search-container">
			<svg class="search-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
			<input type="text" class="search-input" id="search" placeholder="Search apps...">
		</div>
	</div>

	<div id="apps-list"></div>

	<div class="floating-card">
		<button class="floating-btn" id="detach">
			<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path></svg>
			Apply Changes
		</button>
	</div>

	<template id="app-template">
		<label class="app-card">
			<div class="app-info">
				<h3 class="app-label"></h3>
				<p class="app-package"></p>
			</div>
			<div class="checkbox-wrapper">
				<input type="checkbox" class="checkbox">
				<div class="checkbox-visual"></div>
			</div>
		</label>
	</template>
</body>

</html>
