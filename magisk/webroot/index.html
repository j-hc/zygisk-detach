<!DOCTYPE html><html lang=en><meta charset=UTF-8><meta name=viewport content="width=device-width, initial-scale=1.0"><title>Zygisk Detach</title><link rel=stylesheet href=ksu-webui.23364c53.css><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel=stylesheet><script type=module crossorigin src=ksu-webui.44c3ee05.js></script><body>
	<div class=header>
		<div class=title-container>
			<h1>Zygisk Detach</h1>
			<p class=subtitle>Select apps to detach from Play Store updates</p>
		</div>
		<div class=search-container>
			<svg xmlns:xmlns=http://www.w3.org/2000/svg fill=none stroke=currentColor stroke-linecap=round stroke-linejoin=round stroke-width=2 class=search-icon viewBox="0 0 24 24"><circle cx=11 cy=11 r=8 /><line x1=21 x2=16.65 y1=21 y2=16.65 /></svg>
			<input class=search-input id=search placeholder="Search apps...">
		</div>
	</div>

	<div id=apps-list></div>

	<div class=floating-card>
		<button class=floating-btn id=detach>
			<svg xmlns:xmlns=http://www.w3.org/2000/svg fill=none stroke=currentColor stroke-linecap=round stroke-linejoin=round stroke-width=2 viewBox="0 0 24 24"><path d="M12 20h9M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
			Apply Changes
		</button>
	</div>

	<template id=app-template>
		<label class=app-card>
			<div class=app-info>
				<h3 class=app-label></h3>
				<p class=app-package></p>
			</div>
			<div class=checkbox-wrapper>
				<input type=checkbox class=checkbox>
				<div class=checkbox-visual></div>
			</div>
		</label>
	</template>
